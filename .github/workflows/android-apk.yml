name: Build TuneStream Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "spotify-mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Validate Expo project
        run: npx expo-doctor@latest

      - name: Verify production JS bundle
        run: npx expo export --platform android

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project
        run: eas init --force --non-interactive --account arya2009-omg

      - name: Build Android APK
        run: |
          set -e
          eas build --platform android --profile development --non-interactive --wait --verbose-logs --clear-cache --json > eas-build.json
          cat eas-build.json

      - name: Download built APK
        run: |
          set -e
          BUILD_ID=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const b=Array.isArray(d)?d[0]:d; if(!b.id) process.exit(1); console.log(b.id)")
          echo "EAS build ID: $BUILD_ID"

          eas build:view "$BUILD_ID" --json > eas-build-view.json
          cat eas-build-view.json

          APK_URL=$(node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('eas-build-view.json','utf8')); const b=Array.isArray(d)?d[0]:d; const u=b.artifacts && b.artifacts.buildUrl; if(!u) { console.error('APK build URL not found'); process.exit(1); } console.log(u)")
          echo "Downloading APK..."
          mkdir -p artifacts
          curl -fL "$APK_URL" -o artifacts/TuneStream.apk
          test -s artifacts/TuneStream.apk
          ls -lh artifacts/TuneStream.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuneStream-Android-APK
          path: spotify-mobile/artifacts/TuneStream.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: echo "EAS APK build completed and the APK was uploaded to GitHub Actions artifacts."
