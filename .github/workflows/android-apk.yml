name: Build TuneStream Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "spotify-mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Validate Expo project
        run: npx expo-doctor@latest

      - name: Verify production JS bundle
        run: npx expo export --platform android

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project
        run: eas init --force --non-interactive --account arya2009-omg

      - name: Build Android APK
        run: eas build --platform android --profile development --non-interactive --wait --verbose-logs --clear-cache

      - name: Build summary
        run: echo "EAS APK build completed. Download the APK from the EAS build output/link above."
