name: Publish TuneStream OTA Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "EAS Update channel"
        required: true
        default: "preview"
      message:
        description: "Update message"
        required: true
        default: "TuneStream mobile update"

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spotify-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align Expo SDK dependencies
        run: npx expo install --fix

      - name: Validate Expo project
        run: npx expo-doctor@latest

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        run: eas update --channel "${{ inputs.channel }}" --message "${{ inputs.message }}" --non-interactive
