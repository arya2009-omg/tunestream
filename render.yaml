services:
  - type: web
    name: tunestream-api
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        value: "*"
      - key: DATA_DIR
        value: "./data"
      - key: UPLOAD_DIR
        value: "./uploads"
