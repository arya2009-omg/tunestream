<title>TuneStream</title>
<style>
:root{--bg:#090b0d;--panel:#12161a;--panel2:#1a2025;--text:#f5f7f8;--muted:#9aa4ad;--green:#1ed760;--border:#252b30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{min-height:100vh;padding-bottom:92px}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#070809;border-right:1px solid var(--border);padding:22px 14px;z-index:5}.logo{font-size:24px;font-weight:800;margin:0 10px 28px}.logo span{color:var(--green)}
.nav button{display:block;width:100%;padding:12px 13px;margin:4px 0;background:transparent;color:var(--muted);text-align:left;border-radius:8px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav .login{color:var(--green)}
.main{margin-left:230px;padding:24px;max-width:1400px}.topbar{display:flex;gap:14px;align-items:center;margin-bottom:25px}.search{flex:1;max-width:620px;position:relative}.search input{width:100%;padding:13px 17px 13px 42px;border-radius:25px;border:1px solid var(--border);background:var(--panel);color:var(--text);outline:none}.search input:focus{border-color:var(--green)}.search-icon{position:absolute;left:16px;top:12px}.profile{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--panel);padding:7px 12px;border-radius:22px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#000;font-weight:bold}
.hero{padding:42px;border-radius:16px;background:linear-gradient(135deg,#183c29,#111820 55%,#0c0f12);margin-bottom:28px}.hero h1{font-size:clamp(32px,5vw,58px);margin:8px 0}.hero p{color:#c5ccd1;max-width:650px;line-height:1.6}.primary{background:var(--green);color:#000;font-weight:700;padding:12px 20px;border-radius:24px}.secondary{background:var(--panel2);color:var(--text);padding:12px 20px;border-radius:24px;margin-left:8px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.section-head h2{margin:0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:var(--panel);padding:14px;border-radius:12px;transition:.2s}.card:hover{background:var(--panel2);transform:translateY(-2px)}.cover{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:48px;background:#202a30;margin-bottom:13px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.card h3{font-size:15px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:13px;margin:0 0 12px;color:var(--muted)}.play-small{background:var(--green);color:#000;border-radius:50%;width:40px;height:40px;font-weight:bold}
.rows{background:var(--panel);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)}.row:last-child{border:0}.row:hover{background:var(--panel2)}.row-cover{width:42px;height:42px;border-radius:6px;background:#202a30;display:grid;place-items:center}.row-title{font-weight:600}.row-sub{font-size:12px;color:var(--muted);margin-top:3px}.icon-btn{background:transparent;color:var(--muted);padding:7px}.icon-btn:hover{color:var(--text)}.liked{color:#ff4d7d}.empty{text-align:center;padding:50px;color:var(--muted)}
.player{position:fixed;left:230px;right:0;bottom:0;height:82px;background:#101417;border-top:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:12px 22px;z-index:10}.now{width:230px;min-width:150px}.now strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now small{color:var(--muted)}.controls{display:flex;align-items:center;gap:12px}.circle{width:40px;height:40px;border-radius:50%;background:var(--green);color:#000;font-weight:bold}.progress-wrap{flex:1;display:flex;align-items:center;gap:10px}.progress{width:100%;accent-color:var(--green)}.volume{width:110px;accent-color:var(--green)}
.modal-bg{display:none;position:fixed;inset:0;background:#000b;z-index:30;place-items:center;padding:20px}.modal{width:min(400px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:25px}.modal input{width:100%;padding:12px;margin:7px 0 14px;background:#0d1114;border:1px solid var(--border);color:white;border-radius:7px}.modal h2{margin-top:0}.close{float:right;background:transparent;color:var(--muted);font-size:22px}.mobile-menu-btn{display:none;position:fixed;left:10px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--panel2);color:var(--text);font-size:22px;z-index:25;place-items:center}.mobile-drawer-bg{display:none;position:fixed;inset:0;background:#000b;z-index:50}.mobile-drawer{width:min(330px,86vw);height:100%;background:#0d1114;border-right:1px solid var(--border);padding:20px 16px;overflow:auto}.mobile-drawer h2{margin:8px 0 20px}.drawer-item{display:block;width:100%;text-align:left;padding:13px 12px;margin:5px 0;background:transparent;color:var(--text);border-radius:9px}.drawer-item:hover,.drawer-item.active{background:var(--panel2)}.settings-section{border-top:1px solid var(--border);margin-top:16px;padding-top:16px}.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;height:56px;background:#0d1114;border-top:1px solid var(--border);z-index:35;justify-content:space-around;align-items:center}.bottom-nav button{background:transparent;color:var(--muted);font-size:11px;padding:5px 10px}.bottom-nav button.active{color:var(--text)}.toast{position:fixed;right:20px;bottom:105px;background:#222a;color:white;padding:12px 16px;border-radius:8px;display:none;z-index:40}
@media(max-width:800px){.sidebar{display:none}.main{margin-left:0;padding:64px 14px 118px;width:100%;max-width:100vw}.topbar{position:fixed;left:0;right:0;top:0;height:56px;margin:0;padding:8px 12px 8px 58px;background:rgba(9,11,13,.96);backdrop-filter:blur(12px);z-index:20;border-bottom:1px solid var(--border)}.search{max-width:none}.search input{height:42px;padding:10px 14px 10px 40px}.install-app{display:none!important}.profile{padding:5px 8px}.profile span{display:none}.hero{padding:24px 18px;margin-bottom:22px}.hero h1{font-size:34px}.hero p{font-size:14px}.row{grid-template-columns:44px 1fr auto;padding:13px 10px;gap:10px}.row>span{display:none}.row-cover{width:44px;height:44px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:11px}.cover{font-size:40px}.card h3{font-size:14px}.bottom-nav{display:flex}.player{left:0;bottom:56px;height:74px;padding:8px 12px;gap:10px}.now{display:block;min-width:0;width:34%;font-size:12px}.now small{font-size:10px}.controls{gap:5px}.controls .icon-btn{padding:5px}.circle{width:38px;height:38px}.progress-wrap{gap:5px}.progress-wrap small{font-size:9px}.volume{display:none}.mobile-menu-btn{display:grid}}
.hero span{font-weight:800}.hero div:last-child{margin-top:20px}@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}.card,.row,.nav button,.primary,.secondary,.icon-btn,.play-small,.circle{transition:transform .18s ease,background-color .18s ease,color .18s ease,opacity .18s ease}.card:hover{transform:translateY(-4px)}.play-small:hover,.circle:hover{transform:scale(1.06)}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.secondary:hover{background:#232b31;transform:translateY(-1px)}.row{animation:fadeIn .28s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}.search input{transition:border-color .2s ease,box-shadow .2s ease}.search input:focus{box-shadow:0 0 0 3px rgba(30,215,96,.10)}button{border:0;cursor:pointer;font:inherit}.progress{cursor:pointer}.volume{cursor:pointer}.player{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.install-app{display:none;align-items:center;gap:8px;padding:10px 16px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#1ed760;color:#000;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(30,215,96,.18);transition:transform .2s,box-shadow .2s}.install-app:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(30,215,96,.28)}.install-app.show{display:inline-flex}.install-app.installed{display:none}
@media(max-width:800px){html,body{touch-action:pan-x pan-y;overflow-x:hidden}.search input,.modal input{font-size:16px}.app{width:100%;max-width:100vw}.main{width:100%;max-width:100vw;overflow-x:hidden}.hero,.cards,.rows{max-width:100%}}
.feature-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:10px 0 28px}.feature{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;font-weight:800;cursor:pointer}.feature:hover{background:var(--panel2)}.feature p{font-weight:400;color:var(--muted);font-size:13px}.browse-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.browse-pill{padding:22px 16px;border-radius:12px;background:var(--panel);font-weight:800;cursor:pointer}.browse-pill:hover{background:var(--panel2)}.browse-pill small{display:block;color:var(--muted);margin-top:6px;font-weight:400}.context-menu{position:fixed;display:none;min-width:190px;background:#171c20;border:1px solid #30383e;border-radius:10px;box-shadow:0 14px 40px #000b;z-index:100;padding:6px}.context-menu button{display:block;width:100%;text-align:left;background:transparent;color:var(--text);padding:10px 12px;border-radius:7px}.context-menu button:hover{background:#252c31}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}.queue-panel{background:var(--panel);border-radius:12px;padding:14px}.queue-item{display:flex;gap:10px;padding:10px;border-radius:8px}.queue-item:hover{background:var(--panel2)}</style>
<style>
.activity-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}.activity-avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#000;font-weight:800}.notice{padding:12px 14px;background:var(--panel2);border-radius:10px;color:var(--muted);margin:12px 0}
</style><style>.home-hero{position:relative;overflow:hidden;padding:48px;border-radius:22px;background:radial-gradient(circle at 80% 20%,rgba(30,215,96,.24),transparent 35%),linear-gradient(135deg,#14251c,#10171b 52%,#0b0e11);border:1px solid #25332b;min-height:300px;display:flex;align-items:center}.home-hero:after{content:"♪";position:absolute;right:7%;top:-35px;font-size:260px;font-weight:900;color:rgba(30,215,96,.07)}.hero-copy{position:relative;z-index:1;max-width:700px}.eyebrow{letter-spacing:2px;font-size:11px;font-weight:800;color:var(--green)}.home-hero h1{font-size:clamp(38px,5.5vw,68px);line-height:1.02;margin:12px 0}.home-hero p{font-size:15px;color:#b9c3c9;line-height:1.7;max-width:620px}.quick-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.section-sub{color:var(--muted);font-size:13px;margin:5px 0 0}.song-card{position:relative}.song-card .cover{box-shadow:0 12px 28px #0006}.song-card .play-small{position:absolute;right:20px;top:145px;opacity:0}.song-card:hover .play-small{opacity:1}.mini-stat{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--border);padding:14px 16px;border-radius:12px}.mini-stat b{font-size:18px}.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 28px}.mood-row{display:flex;gap:10px;overflow:auto;padding-bottom:4px}.mood{min-width:130px;padding:18px;border-radius:12px;background:var(--panel);border:1px solid var(--border);cursor:pointer;font-weight:800}.mood small{display:block;color:var(--muted);font-weight:400;margin-top:5px}@media(max-width:800px){.home-hero{padding:28px 20px;min-height:350px}.home-hero:after{font-size:180px;right:-10px;top:15px}.home-hero h1{font-size:40px}.home-stats{grid-template-columns:1fr}.song-card .play-small{opacity:1;top:auto;bottom:58px;right:18px}}.notif-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;border-radius:999px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;line-height:1}.nav .notif-badge{vertical-align:middle}.drawer-item .notif-badge{vertical-align:middle}</style></head>
<body><button class="mobile-menu-btn" onclick="openMobileMenu()" aria-label="Open menu">⋮</button><div class="mobile-drawer-bg" id="mobileDrawerBg" onclick="closeMobileMenu(event)"><div class="mobile-drawer" onclick="event.stopPropagation()"><button class="drawer-item" onclick="closeMobileMenu()">✕ Close</button><h2>☰ TuneStream</h2><button class="drawer-item" onclick="homePage();closeMobileMenu()">🏠 Home</button><button class="drawer-item" onclick="searchPage();closeMobileMenu()">🔎 Search</button><button class="drawer-item" onclick="cloudLibraryPage();closeMobileMenu()">📚 Your Library</button><button class="drawer-item" onclick="likedPage();closeMobileMenu()">❤️ Liked Songs</button><button class="drawer-item" onclick="playlistsPage();closeMobileMenu()">🎵 Playlists</button><button class="drawer-item" onclick="historyPage();closeMobileMenu()">🕘 Recently Played</button><button class="drawer-item" onclick="browsePage();closeMobileMenu()">🧭 Browse</button><button class="drawer-item" onclick="friendsPage();closeMobileMenu()">👥 Friends</button><button class="drawer-item" onclick="blendCloudPage();closeMobileMenu()">🔀 Blend</button><button class="drawer-item" onclick="jamCloudPage();closeMobileMenu()">🎧 Jam</button><button class="drawer-item" onclick="activityPage();closeMobileMenu()">📰 Friend Activity</button><button class="drawer-item" onclick="notificationsPage();closeMobileMenu()">🔔 Notifications <span id="mobileNotifBadge" class="notif-badge" style="display:none">0</span></button><button class="drawer-item" onclick="wrappedPage();closeMobileMenu()">✨ Your Wrapped</button><button class="drawer-item" onclick="queuePage();closeMobileMenu()">📋 Queue</button><button class="drawer-item" onclick="accountPage();closeMobileMenu()">👤 Account</button><div class="settings-section"><h3>⚙️ Settings</h3><button class="drawer-item" onclick="toast(navigator.onLine?'You are online':'You are offline')">🌐 Connection Status</button><button class="drawer-item" onclick="toast('Auto-update is enabled')">🔄 Auto Update</button><button class="drawer-item" onclick="toast('TuneStream PWA is ready to install')">📲 App / PWA</button><button class="drawer-item" onclick="toast('Your preferences are saved on this device')">💾 Storage</button><button class="drawer-item" onclick="settingsPage();closeMobileMenu()">⚙️ Full Settings</button></div></div></div><div id="onlineBadge" style="position:fixed;top:14px;right:18px;z-index:20;background:#12161a;border:1px solid #252b30;padding:7px 11px;border-radius:18px;font-size:12px;color:#1ed760">● ONLINE DEMO</div><div class="app"><aside class="sidebar"><div class="logo">Tune<span>Stream</span></div><nav class="nav">
<button id="nav-home" onclick="homePage()">🏠 Home</button><button id="nav-search" onclick="searchPage()">🔎 Search</button><button id="nav-library" onclick="cloudLibraryPage()">📚 Your Library</button><button id="nav-liked" onclick="likedPage()">❤️ Liked Songs</button><button id="nav-playlists" onclick="playlistsPage()">🎵 Playlists</button><button id="nav-history" onclick="historyPage()">🕘 Recently Played</button><button id="nav-browse" onclick="browsePage()">🧭 Browse</button><button id="nav-friends" onclick="friendsPage()">👥 Friends</button><button id="nav-notifications" onclick="notificationsPage()">🔔 Notifications <span id="desktopNotifBadge" class="notif-badge" style="display:none">0</span></button><button id="nav-blend" onclick="blendCloudPage()">🔀 Blend</button><button id="nav-account" onclick="accountPage()">👤 Account</button><button id="nav-jam" onclick="jamCloudPage()">🎧 Jam</button><button id="nav-wrapped" onclick="wrappedPage()">✨ Wrapped</button><button id="nav-queue" onclick="queuePage()">📋 Queue</button><button id="nav-login" class="login" onclick="openAuth()">👤 Login</button><button id="nav-download" class="login" style="display:none" onclick="downloadTuneStream()">⬇️ Download</button>
</nav></aside><main class="main"><div class="topbar"><div class="search"><span class="search-icon">🔎</span><input id="searchInput" placeholder="What do you want to play?" oninput="liveSearch(this.value)"></div><button id="installAppBtn" class="install-app" onclick="installTuneStream()" aria-label="Install TuneStream">📲 Install App</button><div class="profile"><label class="avatar" id="avatar" for="profilePhotoInput" style="cursor:pointer;overflow:hidden" title="Change profile photo">G</label><input id="profilePhotoInput" type="file" accept="image/*" style="display:none" onchange="changeProfilePhoto(event)"><span id="profileName" onclick="accountPage()" style="cursor:pointer">Guest</span></div></div><div id="content"></div></main></div>
<div class="player"><div class="now"><strong id="nowTitle">No song selected</strong><small id="nowArtist">Choose a song to start</small></div><div class="controls"><button class="icon-btn" onclick="previousSong()">⏮</button><button class="circle" id="playBtn" onclick="togglePlay()">▶</button><button class="icon-btn" onclick="nextSong()">⏭</button><button class="icon-btn" onclick="toggleShuffle()" id="shuffleBtn">🔀</button></div><div class="progress-wrap"><small id="currentTime">0:00</small><input class="progress" id="progress" type="range" min="0" max="100" value="0" oninput="seek(this.value)"><small id="duration">0:00</small></div><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8" oninput="audio.volume=this.value"></div>
<div class="modal-bg" id="authModal"><div class="modal"><button class="close" onclick="closeAuth()">×</button><h2 id="authTitle">Login</h2><input id="authName" placeholder="Name" style="display:none"><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"><button class="primary" style="width:100%" onclick="submitAuth()">Continue</button><p class="muted" id="authSwitch">New here? <button class="icon-btn" onclick="showSignup()">Create account</button></p></div></div><div class="toast" id="toast"></div><audio id="audio"></audio>
<script>
const songs=[{id:1,title:"Midnight Drive",artist:"TuneStream",album:"Night City",emoji:"🌃",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},{id:2,title:"Neon Nights",artist:"TuneStream",album:"Night City",emoji:"🌌",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},{id:3,title:"Afterglow",artist:"TuneStream",album:"Afterglow",emoji:"🌅",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},{id:4,title:"City Lights",artist:"TuneStream",album:"City Lights",emoji:"🌆",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},{id:5,title:"Ocean Dreams",artist:"Nova",album:"Blue",emoji:"🌊",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"},{id:6,title:"Lost Stars",artist:"Aria",album:"Universe",emoji:"✨",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"},{id:7,title:"Sunset Boulevard",artist:"Nova",album:"Summer",emoji:"🌇",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3"},{id:8,title:"Electric Heart",artist:"Aria",album:"Pulse",emoji:"💚",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"}];
const audio=document.getElementById("audio");audio.preload="metadata";let queue=[...songs],currentIndex=0,shuffle=false,playing=false,authMode="login",currentPage="home";
const liked=()=>JSON.parse(localStorage.getItem("tunestream_liked")||"[]"),saveLiked=x=>localStorage.setItem("tunestream_liked",JSON.stringify(x)),history=()=>JSON.parse(localStorage.getItem("tunestream_history")||"[]"),saveHistory=x=>localStorage.setItem("tunestream_history",JSON.stringify(x));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function toast(m){let t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",2200)}function setActive(id){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(id)document.getElementById(id)?.classList.add("active");document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));let bm={"nav-home":"bottom-home","nav-search":"bottom-search","nav-library":"bottom-library","nav-playlists":"bottom-playlists"}[id];if(bm)document.getElementById(bm)?.classList.add("active")}function openMobileMenu(){document.getElementById("mobileDrawerBg").style.display="block"}function closeMobileMenu(e){if(!e||e.target===e.currentTarget)document.getElementById("mobileDrawerBg").style.display="none"}
function createCard(s){return `<div class="card"><div class="cover">${s.emoji}</div><h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p><button class="play-small" onclick="playSongById(${s.id})">▶</button></div>`}
function createRow(s){let il=liked().includes(s.id);return `<div class="row"><div class="row-cover">${s.emoji}</div><div onclick="playSongById(${s.id})" style="cursor:pointer"><div class="row-title">${esc(s.title)}</div><div class="row-sub">${esc(s.artist)} • ${esc(s.album)}</div></div><span class="muted">TuneStream</span><div><button class="icon-btn ${il?"liked":""}" onclick="toggleLike(${s.id})">${il?"♥":"♡"}</button><button class="icon-btn" onclick="playSongById(${s.id})">▶</button></div></div>`}

function openAuth(){document.getElementById("authModal").style.display="grid";showLogin()}function closeAuth(){document.getElementById("authModal").style.display="none"}function showLogin(){authMode="login";document.getElementById("authTitle").textContent="Login";document.getElementById("authName").style.display="none";document.getElementById("authSwitch").innerHTML='New here? <button class="icon-btn" onclick="showSignup()">Create account</button>'}function showSignup(){authMode="signup";document.getElementById("authTitle").textContent="Create account";document.getElementById("authName").style.display="block";document.getElementById("authSwitch").innerHTML='Already have an account? <button class="icon-btn" onclick="showLogin()">Login</button>'}async function submitAuth(){let n=document.getElementById("authName").value.trim(),e=document.getElementById("authEmail").value.trim(),p=document.getElementById("authPassword").value;if(!e||!p)return toast("Enter email and password");try{if(window.TuneStreamCloud&&TuneStreamCloud.enabled()){let r=authMode==="signup"?await TuneStreamCloud.signUp(n,e,p):await TuneStreamCloud.signIn(e,p);let u=r.user||r.session?.user;if(u){localStorage.setItem("tunestream_user",JSON.stringify({name:n||u.user_metadata?.name||e.split("@")[0],email:e,id:u.id}));updateProfile();closeAuth();toast(authMode==="signup"?"Account created":"Logged in");if(authMode==="signup"&&!r.session)toast("Check your email to confirm the account")}return}localStorage.setItem("tunestream_user",JSON.stringify({name:n||e.split("@")[0],email:e}));updateProfile();closeAuth();toast(authMode==="signup"?"Demo account created":"Demo login")}catch(err){toast(err.message||"Authentication failed")}}

if("serviceWorker" in navigator){
  let tsRefreshing=false;
  async function checkTuneStreamUpdate(){
    try{
      const reg=await navigator.serviceWorker.getRegistration("./");
      if(reg) await reg.update();
    }catch(e){}
  }
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
      await reg.update();
      reg.addEventListener("updatefound",()=>{
        const worker=reg.installing;
        if(!worker)return;
        worker.addEventListener("statechange",()=>{
          if(worker.state==="installed" && navigator.serviceWorker.controller){
            worker.postMessage({action:"skipWaiting"});
          }
        });
      });
      setInterval(checkTuneStreamUpdate,60000);
    }catch(e){}
  });
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(tsRefreshing)return;
    tsRefreshing=true;
    window.location.reload();
  });
}
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;showInstallButton()});
window.addEventListener("load",()=>setTimeout(showInstallButton,1200));
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;hideInstallButton();toast("TuneStream installed successfully 🎧")});
function showInstallButton(){let b=document.getElementById("installAppBtn");if(b&&!window.matchMedia("(display-mode: standalone)").matches)b.classList.add("show")}
function hideInstallButton(){let b=document.getElementById("installAppBtn");if(b)b.classList.remove("show")}
async function installTuneStream(){
  if(!deferredInstallPrompt){
    if(/Android/i.test(navigator.userAgent))toast("Chrome menu ⋮ → Add to Home screen → Install TuneStream");
    else toast("Use your browser's Install App or Add to Home Screen option");
    return;
  }
  deferredInstallPrompt.prompt();
  const choice=await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  if(choice.outcome==="accepted"){hideInstallButton();toast("Installing TuneStream…")}
}
if(window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true)hideInstallButton();
</script>

window.renderFriends=async function(){const box=document.getElementById('friendList');if(!box)return;try{const rows=await TuneStreamCloud.friends();box.innerHTML=rows.length?rows.map(x=>{const incoming=x.addressee_id===JSON.parse(localStorage.getItem('tunestream_user')||'{}').id;const person=incoming?x.requester:x.addressee;return '<div class="row"><div class="row-cover">👤</div><div><div class="row-title">'+esc(person?.display_name||person?.username||'User')+'</div><div class="row-sub">@'+esc(person?.username||'')+' • '+esc(x.status)+'</div></div>'+(x.status==='pending'&&incoming?'<button class="secondary" onclick="respondFriendReq(\''+x.id+'\',\'accepted\')">Accept</button>':'')+(x.status==='pending'&&!incoming?'<span class="muted">Pending</span>':'')+'</div>'}).join(''):'<div class="empty">No friend requests or friends yet.</div>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}};
window.respondFriendReq=async function(id,status){try{await TuneStreamCloud.respondFriend(id,status);toast(status==='accepted'?'Friend added 👥':'Request blocked');renderFriends()}catch(e){toast(e.message)}};
window.searchFriends=async function(){const q=document.getElementById('friendSearch').value;const box=document.getElementById('friendResults');if(!q.trim())return;box.innerHTML='<div class="empty">Searching…</div>';try{const rows=await TuneStreamCloud.searchProfiles(q);box.innerHTML=rows.length?rows.map(u=>'<div class="row"><div class="row-cover">👤</div><div><div class="row-title">'+esc(u.display_name||u.username||'User')+'</div><div class="row-sub">@'+esc(u.username||'')+'</div></div><button class="secondary" onclick="sendFriend(\''+u.id+'\')">Add Friend</button></div>').join(''):'<div class="empty">No users found.</div>'}catch(e){box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}};
const oldToggleLike=window.toggleLike;window.toggleLike=async function(id){oldToggleLike(id);if(TuneStreamCloud.enabled()){try{const l=await TuneStreamCloud.cloudLikes();if(l.includes(id))await TuneStreamCloud.likeSong(id);else await TuneStreamCloud.unlikeSong(id)}catch(e){}}};
const oldStart=window.startCurrentSong;window.startCurrentSong=function(){oldStart();if(TuneStreamCloud.enabled()){const s=queue[currentIndex];if(s)TuneStreamCloud.recordPlay(s.id).catch(()=>{})}};
window.syncCloudData=async function(){if(!TuneStreamCloud.enabled())return;try{const l=await TuneStreamCloud.cloudLikes();saveLiked(l);const h=await TuneStreamCloud.cloudHistory();saveHistory([...new Set(h.map(x=>x.song_id))].slice(0,30));refreshCurrentPage()}catch(e){}};
window.addEventListener('tunestream-auth',function(e){if(e.detail.session){setTimeout(syncCloudData,100)}})
})();
</script><script>
(function(){
window.blendCloudPage=async function(){
 currentPage='blend';setActive('nav-blend');const c=document.getElementById('content');
 if(!TuneStreamCloud.enabled())return c.innerHTML='<div class="empty">Please login to use Blend.</div>';
 c.innerHTML='<div class="empty">Loading Blend…</div>';
 try{const ps=await TuneStreamCloud.client().from('blends').select('*').order('created_at',{ascending:false});if(ps.error)throw ps.error;
 c.innerHTML='<div class="section-head"><div><h2>Blend</h2><p class="muted">Shared music based on everyone in the Blend.</p></div><button class="primary" onclick="createBlendCloud()">＋ New Blend</button></div><div class="cards">'+(ps.data?.length?ps.data.map(b=>'<div class="card"><div class="cover">🔀</div><h3>'+esc(b.name)+'</h3><p>Shared Blend</p><button class="secondary" style="margin:0" onclick="openBlendCloud(\''+b.id+'\')">Open</button></div>').join(''):'<div class="empty">Create your first Blend.</div>')+'</div>'}catch(e){c.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
};
window.openBlendCloud=async function(id){
 const c=document.getElementById('content');c.innerHTML='<div class="empty">Building your Blend…</div>';
 try{const members=await TuneStreamCloud.blendMembers(id);const ids=await TuneStreamCloud.blendRecommendations(id);const rec=ids.map(x=>songs.find(s=>s.id===x)).filter(Boolean);c.innerHTML='<div class="section-head"><div><h2>🔀 Blend</h2><p class="muted">'+members.length+' member(s) • Like-based shared mix</p></div><button class="secondary" onclick="blendCloudPage()">Back</button></div><div class="queue-panel"><input id="blendFriendId" placeholder="Paste a friend user ID to invite" style="width:100%;padding:12px;background:#0d1114;border:1px solid var(--border);color:white;border-radius:7px"><button class="secondary" style="margin:10px 0" onclick="inviteBlend(\''+id+'\')">Invite Friend</button></div><div class="section-head"><h2>Blend Tracks</h2><button class="primary" onclick="saveCurrentBlend(\''+id+'\')">Save as Playlist</button></div><div class="rows">'+(rec.length?rec.map(createRow).join(''):'<div class="empty">Like some songs to build the shared mix.</div>')+'</div>'}catch(e){c.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
};
window.inviteBlend=async function(id){const uid=document.getElementById('blendFriendId').value.trim();if(!uid)return;try{await TuneStreamCloud.addBlendMember(id,uid);toast('Friend added to Blend 🔀');openBlendCloud(id)}catch(e){toast(e.message)}};
window.saveCurrentBlend=async function(id){try{const ids=await TuneStreamCloud.blendRecommendations(id);if(!ids.length)return toast('Blend has no tracks yet');await TuneStreamCloud.saveBlendPlaylist(id,ids,'My TuneStream Blend');toast('Blend saved as cloud playlist ☁️')}catch(e){toast(e.message)}};
window.openJamRoom=async function(id){const c=document.getElementById('content');c.innerHTML='<section class="hero"><div class="muted">LIVE JAM</div><h1>Jam Room</h1><p>Room ID: <b>'+esc(id)+'</b></p><div><button class="primary" onclick="jamPlayCurrent()">▶ Share Playback</button><button class="secondary" onclick="jamSendState(\'pause\')">Pause</button></div></section><div class="rows" id="jamEvents"><div class="empty">Connecting to live room…</div></div>';try{const ch=await TuneStreamCloud.jamChannel(id);TuneStreamCloud.subscribeJam(ch,function(e){const s=e.payload||{};const target=s.position??0;if(s.songId&&queue[currentIndex]?.id!==Number(s.songId))playSongById(Number(s.songId));if(Number.isFinite(target)&&Math.abs((audio.currentTime||0)-target)>1.5)audio.currentTime=target;if(s.action==='pause')audio.pause();if(s.action==='play')audio.play().catch(()=>{});document.getElementById('jamEvents').innerHTML='<div class="empty">Live sync • '+esc(s.action||'state')+' • '+esc(s.title||'')+'</div>'});window.activeTuneJam=ch;await ch.subscribe()}catch(e){toast('Jam connection failed: '+e.message)}};
window.jamPlayCurrent=function(){const s=queue[currentIndex];if(!s||!window.activeTuneJam)return;TuneStreamCloud.broadcastPlayback(window.activeTuneJam,{action:audio.paused?'play':'pause',songId:s.id,title:s.title,position:audio.currentTime,at:Date.now()});toast('Jam playback synced 🎧')};
window.jamSendState=function(action){const s=queue[currentIndex];if(!s||!window.activeTuneJam)return;TuneStreamCloud.broadcastPlayback(window.activeTuneJam,{action,songId:s.id,title:s.title,position:audio.currentTime,at:Date.now()})};
})();
</script><script>
(function(){
window.activityPage=async function(){
 currentPage='activity';setActive(null);const c=document.getElementById('content');
 if(!TuneStreamCloud.enabled())return c.innerHTML='<div class="empty">Login to see Friend Activity.</div>';
 c.innerHTML='<div class="section-head"><h2>Friend Activity</h2><span class="muted">What your friends are listening to</span></div><div id="activityList"><div class="empty">Loading activity…</div></div>';
 try{const fs=await TuneStreamCloud.friends();const accepted=fs.filter(x=>x.status==='accepted');const ids=accepted.map(x=>x.requester_id===JSON.parse(localStorage.getItem('tunestream_user')||'{}').id?x.addressee_id:x.requester_id);
 if(!ids.length)return document.getElementById('activityList').innerHTML='<div class="notice">Add friends to build your activity feed.</div>';
 const r=await TuneStreamCloud.client().from('listening_history').select('user_id,song_id,played_at,profiles(display_name,username),songs(title,artist)').in('user_id',ids).order('played_at',{ascending:false}).limit(30);
 if(r.error)throw r.error;
 document.getElementById('activityList').innerHTML=r.data?.length?r.data.map(x=>'<div class="activity-card"><div class="activity-avatar">♪</div><div><b>'+esc(x.profiles?.display_name||x.profiles?.username||'Friend')+'</b><div class="muted">listened to <strong>'+esc(x.songs?.title||'Unknown')+'</strong> • '+esc(x.songs?.artist||'')+'</div><small class="muted">'+new Date(x.played_at).toLocaleString()+'</small></div></div>').join(''):'<div class="notice">No recent listening activity from your friends.</div>';
 }catch(e){document.getElementById('activityList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
};
window.collabPlaylistPage=async function(){
 currentPage='collab';setActive(null);const c=document.getElementById('content');
 if(!TuneStreamCloud.enabled())return c.innerHTML='<div class="empty">Login to use collaborative playlists.</div>';
 try{const ps=await TuneStreamCloud.listPlaylists();c.innerHTML='<div class="section-head"><div><h2>Collaborative Playlists</h2><p class="muted">Share a public playlist and let friends add music.</p></div><button class="primary" onclick="createCollabPlaylist()">＋ Create</button></div><div class="cards">'+(ps.filter(x=>x.is_public).map(p=>'<div class="card"><div class="cover">🤝</div><h3>'+esc(p.name)+'</h3><p>Public playlist</p><button class="secondary" style="margin:0" onclick="openCloudPlaylist(\''+p.id+'\')">Open</button></div>').join('')||'<div class="empty">No public playlists yet.</div>')+'</div>'}catch(e){c.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}

window.createCollabPlaylist=async function(){const n=prompt('Playlist name:');if(!n?.trim())return;try{await TuneStreamCloud.createPlaylist(n.trim(),'Collaborative playlist',true);toast('Public collaborative playlist created 🤝');collabPlaylistPage()}catch(e){toast(e.message)}};
})();
</script><script>
(function(){
let notificationChannel=null;
window.notificationsPage=async function(){
 currentPage='notifications';setActive(null);const el=document.getElementById('content');
 if(!TuneStreamCloud.enabled())return el.innerHTML='<div class="empty">Login to see notifications.</div>';
 el.innerHTML='<div class="section-head"><h2>Notifications</h2><button class="secondary" onclick="notificationsPage()">Refresh</button></div><div id="notificationsList"><div class="empty">Loading…</div></div>';
 try{const n=await TuneStreamCloud.notifications();document.getElementById('notificationsList').innerHTML=n.length?n.map(x=>'<div class="activity-card" onclick="TuneStreamCloud.markNotificationRead(\''+x.id+'\');this.style.opacity=.55"><div class="activity-avatar">'+(x.read?'✓':'•')+'</div><div><b>'+esc(x.message)+'</b><small class="muted" style="display:block">'+new Date(x.created_at).toLocaleString()+'</small></div></div>').join(''):'<div class="notice">No notifications yet.</div>'}catch(e){document.getElementById('notificationsList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
};
window.respondNotificationFriend=async function(id,status,notificationId){try{await TuneStreamCloud.respondFriend(id,status);await TuneStreamCloud.markNotificationRead(notificationId);toast(status==='accepted'?'Friend request accepted 👥':'Friend request rejected');updateNotificationBadge();notificationsPage()}catch(e){toast(e.message)}};
window.updateNotificationBadge=async function(list){try{if(!TuneStreamCloud.enabled())return;const count=Array.isArray(list)?list.filter(x=>!x.read).length:await TuneStreamCloud.unreadNotifications();const ids=['desktopNotifBadge','mobileNotifBadge'];ids.forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=count;el.style.display=count?'inline-flex':'none'}})}catch(e){}};
window.startRealtime=async function(){
 if(!TuneStreamCloud.enabled()||notificationChannel)return;
 notificationChannel=TuneStreamCloud.subscribeNotifications(function(){if(typeof toast==='function')toast('🔔 New TuneStream notification');updateNotificationBadge();if(currentPage==='notifications')notificationsPage()});
 TuneStreamCloud.subscribeFriendActivity(function(){if(currentPage==='activity')activityPage();});
};
window.addEventListener('tunestream-auth',function(){setTimeout(startRealtime,300)});
window.addEventListener('load',function(){setTimeout(startRealtime,1000);setTimeout(updateNotificationBadge,1200)});
})();
</script><script>

out')">⚡ Workout<small>Energy</small></div><div class="mood" onclick="filterMusic('Party')">🎉 Party<small>Dance mode</small></div></div><div class="section-head"><div><h2>Trending Now</h2><p class="section-sub">Popular tracks on TuneStream.</p></div><button class="secondary" onclick="queuePage()">Queue</button></div><div class="rows">'+rows+'</div>';
