<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090b0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TuneStream">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TuneStream</title>
<style>
:root{--bg:#090b0d;--panel:#12161a;--panel2:#1a2025;--text:#f5f7f8;--muted:#9aa4ad;--green:#1ed760;--border:#252b30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{min-height:100vh;padding-bottom:92px}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#070809;border-right:1px solid var(--border);padding:22px 14px;z-index:5}.logo{font-size:24px;font-weight:800;margin:0 10px 28px}.logo span{color:var(--green)}
.nav button{display:block;width:100%;padding:12px 13px;margin:4px 0;background:transparent;color:var(--muted);text-align:left;border-radius:8px}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}.nav .login{color:var(--green)}
.main{margin-left:230px;padding:24px;max-width:1400px}.topbar{display:flex;gap:14px;align-items:center;margin-bottom:25px}.search{flex:1;max-width:620px;position:relative}.search input{width:100%;padding:13px 17px 13px 42px;border-radius:25px;border:1px solid var(--border);background:var(--panel);color:var(--text);outline:none}.search input:focus{border-color:var(--green)}.search-icon{position:absolute;left:16px;top:12px}.profile{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--panel);padding:7px 12px;border-radius:22px}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#000;font-weight:bold}
.hero{padding:42px;border-radius:16px;background:linear-gradient(135deg,#183c29,#111820 55%,#0c0f12);margin-bottom:28px}.hero h1{font-size:clamp(32px,5vw,58px);margin:8px 0}.hero p{color:#c5ccd1;max-width:650px;line-height:1.6}.primary{background:var(--green);color:#000;font-weight:700;padding:12px 20px;border-radius:24px}.secondary{background:var(--panel2);color:var(--text);padding:12px 20px;border-radius:24px;margin-left:8px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.section-head h2{margin:0}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}.card{background:var(--panel);padding:14px;border-radius:12px;transition:.2s}.card:hover{background:var(--panel2);transform:translateY(-2px)}.cover{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:48px;background:#202a30;margin-bottom:13px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.card h3{font-size:15px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{font-size:13px;margin:0 0 12px;color:var(--muted)}.play-small{background:var(--green);color:#000;border-radius:50%;width:40px;height:40px;font-weight:bold}
.rows{background:var(--panel);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)}.row:last-child{border:0}.row:hover{background:var(--panel2)}.row-cover{width:42px;height:42px;border-radius:6px;background:#202a30;display:grid;place-items:center}.row-title{font-weight:600}.row-sub{font-size:12px;color:var(--muted);margin-top:3px}.icon-btn{background:transparent;color:var(--muted);padding:7px}.icon-btn:hover{color:var(--text)}.liked{color:#ff4d7d}.empty{text-align:center;padding:50px;color:var(--muted)}
.player{position:fixed;left:230px;right:0;bottom:0;height:82px;background:#101417;border-top:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:12px 22px;z-index:10}.now{width:230px;min-width:150px}.now strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now small{color:var(--muted)}.controls{display:flex;align-items:center;gap:12px}.circle{width:40px;height:40px;border-radius:50%;background:var(--green);color:#000;font-weight:bold}.progress-wrap{flex:1;display:flex;align-items:center;gap:10px}.progress{width:100%;accent-color:var(--green)}.volume{width:110px;accent-color:var(--green)}
.modal-bg{display:none;position:fixed;inset:0;background:#000b;z-index:30;place-items:center;padding:20px}.modal{width:min(400px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:25px}.modal input{width:100%;padding:12px;margin:7px 0 14px;background:#0d1114;border:1px solid var(--border);color:white;border-radius:7px}.modal h2{margin-top:0}.close{float:right;background:transparent;color:var(--muted);font-size:22px}.mobile-menu-btn{display:none;position:fixed;left:10px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--panel2);color:var(--text);font-size:22px;z-index:25;place-items:center}.mobile-drawer-bg{display:none;position:fixed;inset:0;background:#000b;z-index:50}.mobile-drawer{width:min(330px,86vw);height:100%;background:#0d1114;border-right:1px solid var(--border);padding:20px 16px;overflow:auto}.mobile-drawer h2{margin:8px 0 20px}.drawer-item{display:block;width:100%;text-align:left;padding:13px 12px;margin:5px 0;background:transparent;color:var(--text);border-radius:9px}.drawer-item:hover,.drawer-item.active{background:var(--panel2)}.settings-section{border-top:1px solid var(--border);margin-top:16px;padding-top:16px}.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;height:56px;background:#0d1114;border-top:1px solid var(--border);z-index:35;justify-content:space-around;align-items:center}.bottom-nav button{background:transparent;color:var(--muted);font-size:11px;padding:5px 10px}.bottom-nav button.active{color:var(--text)}.toast{position:fixed;right:20px;bottom:105px;background:#222a;color:white;padding:12px 16px;border-radius:8px;display:none;z-index:40}
@media(max-width:800px){.sidebar{display:none}.main{margin-left:0;padding:64px 14px 118px;width:100%;max-width:100vw}.topbar{position:fixed;left:0;right:0;top:0;height:56px;margin:0;padding:8px 12px 8px 58px;background:rgba(9,11,13,.96);backdrop-filter:blur(12px);z-index:20;border-bottom:1px solid var(--border)}.search{max-width:none}.search input{height:42px;padding:10px 14px 10px 40px}.install-app{display:none!important}.profile{padding:5px 8px}.profile span{display:none}.hero{padding:24px 18px;margin-bottom:22px}.hero h1{font-size:34px}.hero p{font-size:14px}.row{grid-template-columns:44px 1fr auto;padding:13px 10px;gap:10px}.row>span{display:none}.row-cover{width:44px;height:44px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:11px}.cover{font-size:40px}.card h3{font-size:14px}.bottom-nav{display:flex}.player{left:0;bottom:56px;height:74px;padding:8px 12px;gap:10px}.now{display:block;min-width:0;width:34%;font-size:12px}.now small{font-size:10px}.controls{gap:5px}.controls .icon-btn{padding:5px}.circle{width:38px;height:38px}.progress-wrap{gap:5px}.progress-wrap small{font-size:9px}.volume{display:none}.mobile-menu-btn{display:grid}}
.hero span{font-weight:800}.hero div:last-child{margin-top:20px}@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}.card,.row,.nav button,.primary,.secondary,.icon-btn,.play-small,.circle{transition:transform .18s ease,background-color .18s ease,color .18s ease,opacity .18s ease}.card:hover{transform:translateY(-4px)}.play-small:hover,.circle:hover{transform:scale(1.06)}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.secondary:hover{background:#232b31;transform:translateY(-1px)}.row{animation:fadeIn .28s ease both}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}.search input{transition:border-color .2s ease,box-shadow .2s ease}.search input:focus{box-shadow:0 0 0 3px rgba(30,215,96,.10)}button{border:0;cursor:pointer;font:inherit}.progress{cursor:pointer}.volume{cursor:pointer}.player{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

.install-app{display:none;align-items:center;gap:8px;padding:10px 16px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#1ed760;color:#000;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(30,215,96,.18);transition:transform .2s,box-shadow .2s}.install-app:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(30,215,96,.28)}.install-app.show{display:inline-flex}.install-app.installed{display:none}
@media(max-width:800px){html,body{touch-action:pan-x pan-y;overflow-x:hidden}.search input,.modal input{font-size:16px}.app{width:100%;max-width:100vw}.main{width:100%;max-width:100vw;overflow-x:hidden}.hero,.cards,.rows{max-width:100%}}
</style>
</head>
<body><button class="mobile-menu-btn" onclick="openMobileMenu()" aria-label="Open menu">⋮</button><div class="mobile-drawer-bg" id="mobileDrawerBg" onclick="closeMobileMenu(event)"><div class="mobile-drawer" onclick="event.stopPropagation()"><button class="drawer-item" onclick="closeMobileMenu()">✕ Close</button><h2>☰ TuneStream</h2><button class="drawer-item" onclick="homePage();closeMobileMenu()">🏠 Home</button><button class="drawer-item" onclick="searchPage();closeMobileMenu()">🔎 Search</button><button class="drawer-item" onclick="libraryPage();closeMobileMenu()">📚 Your Library</button><button class="drawer-item" onclick="likedPage();closeMobileMenu()">❤️ Liked Songs</button><button class="drawer-item" onclick="playlistsPage();closeMobileMenu()">🎵 Playlists</button><button class="drawer-item" onclick="historyPage();closeMobileMenu()">🕘 Recently Played</button><button class="drawer-item" onclick="browsePage();closeMobileMenu()">🧭 Browse</button><button class="drawer-item" onclick="wrappedPage();closeMobileMenu()">✨ Your Wrapped</button><button class="drawer-item" onclick="queuePage();closeMobileMenu()">📋 Queue</button><button class="drawer-item" onclick="openAuth();closeMobileMenu()">👤 Login / Account</button><div class="settings-section"><h3>⚙️ Settings</h3><button class="drawer-item" onclick="toast(navigator.onLine?'You are online':'You are offline')">🌐 Connection Status</button><button class="drawer-item" onclick="toast('Auto-update is enabled')">🔄 Auto Update</button><button class="drawer-item" onclick="toast('TuneStream PWA is ready to install')">📲 App / PWA</button><button class="drawer-item" onclick="toast('Your preferences are saved on this device')">💾 Storage</button></div></div></div><div id="onlineBadge" style="position:fixed;top:14px;right:18px;z-index:20;background:#12161a;border:1px solid #252b30;padding:7px 11px;border-radius:18px;font-size:12px;color:#1ed760">● ONLINE DEMO</div><div class="app"><aside class="sidebar"><div class="logo">Tune<span>Stream</span></div><nav class="nav">
<button id="nav-home" onclick="homePage()">🏠 Home</button><button id="nav-search" onclick="searchPage()">🔎 Search</button><button id="nav-library" onclick="libraryPage()">📚 Your Library</button><button id="nav-liked" onclick="likedPage()">❤️ Liked Songs</button><button id="nav-playlists" onclick="playlistsPage()">🎵 Playlists</button><button id="nav-history" onclick="historyPage()">🕘 Recently Played</button><button id="nav-browse" onclick="browsePage()">🧭 Browse</button><button id="nav-wrapped" onclick="wrappedPage()">✨ Wrapped</button><button id="nav-queue" onclick="queuePage()">📋 Queue</button><button id="nav-login" class="login" onclick="openAuth()">👤 Login</button><button id="nav-download" class="login" style="display:none" onclick="downloadTuneStream()">⬇️ Download</button>
</nav></aside><main class="main"><div class="topbar"><div class="search"><span class="search-icon">🔎</span><input id="searchInput" placeholder="What do you want to play?" oninput="liveSearch(this.value)"></div><button id="installAppBtn" class="install-app" onclick="installTuneStream()" aria-label="Install TuneStream">📲 Install App</button><div class="profile"><label class="avatar" id="avatar" for="profilePhotoInput" style="cursor:pointer;overflow:hidden" title="Change profile photo">G</label><input id="profilePhotoInput" type="file" accept="image/*" style="display:none" onchange="changeProfilePhoto(event)"><span id="profileName">Guest</span></div></div><div id="content"></div></main></div>
<div class="player"><div class="now"><strong id="nowTitle">No song selected</strong><small id="nowArtist">Choose a song to start</small></div><div class="controls"><button class="icon-btn" onclick="previousSong()">⏮</button><button class="circle" id="playBtn" onclick="togglePlay()">▶</button><button class="icon-btn" onclick="nextSong()">⏭</button><button class="icon-btn" onclick="toggleShuffle()" id="shuffleBtn">🔀</button></div><div class="progress-wrap"><small id="currentTime">0:00</small><input class="progress" id="progress" type="range" min="0" max="100" value="0" oninput="seek(this.value)"><small id="duration">0:00</small></div><input class="volume" id="volume" type="range" min="0" max="1" step=".01" value=".8" oninput="audio.volume=this.value"></div>
<div class="modal-bg" id="authModal"><div class="modal"><button class="close" onclick="closeAuth()">×</button><h2 id="authTitle">Login</h2><input id="authName" placeholder="Name" style="display:none"><input id="authEmail" type="email" placeholder="Email"><input id="authPassword" type="password" placeholder="Password"><button class="primary" style="width:100%" onclick="submitAuth()">Continue</button><p class="muted" id="authSwitch">New here? <button class="icon-btn" onclick="showSignup()">Create account</button></p></div></div><div class="toast" id="toast"></div><audio id="audio"></audio>
<script>
const songs=[{id:1,title:"Midnight Drive",artist:"TuneStream",album:"Night City",emoji:"🌃",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},{id:2,title:"Neon Nights",artist:"TuneStream",album:"Night City",emoji:"🌌",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},{id:3,title:"Afterglow",artist:"TuneStream",album:"Afterglow",emoji:"🌅",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},{id:4,title:"City Lights",artist:"TuneStream",album:"City Lights",emoji:"🌆",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},{id:5,title:"Ocean Dreams",artist:"Nova",album:"Blue",emoji:"🌊",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"},{id:6,title:"Lost Stars",artist:"Aria",album:"Universe",emoji:"✨",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"},{id:7,title:"Sunset Boulevard",artist:"Nova",album:"Summer",emoji:"🌇",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3"},{id:8,title:"Electric Heart",artist:"Aria",album:"Pulse",emoji:"💚",audio:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"}];
const audio=document.getElementById("audio");audio.preload="metadata";let queue=[...songs],currentIndex=0,shuffle=false,playing=false,authMode="login",currentPage="home";
const liked=()=>JSON.parse(localStorage.getItem("tunestream_liked")||"[]"),saveLiked=x=>localStorage.setItem("tunestream_liked",JSON.stringify(x)),history=()=>JSON.parse(localStorage.getItem("tunestream_history")||"[]"),saveHistory=x=>localStorage.setItem("tunestream_history",JSON.stringify(x));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function toast(m){let t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",2200)}function setActive(id){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));if(id)document.getElementById(id)?.classList.add("active");document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));let bm={"nav-home":"bottom-home","nav-search":"bottom-search","nav-library":"bottom-library","nav-playlists":"bottom-playlists"}[id];if(bm)document.getElementById(bm)?.classList.add("active")}function openMobileMenu(){document.getElementById("mobileDrawerBg").style.display="block"}function closeMobileMenu(e){if(!e||e.target===e.currentTarget)document.getElementById("mobileDrawerBg").style.display="none"}
function createCard(s){return `<div class="card"><div class="cover">${s.emoji}</div><h3>${esc(s.title)}</h3><p>${esc(s.artist)}</p><button class="play-small" onclick="playSongById(${s.id})">▶</button></div>`}
function createRow(s){let il=liked().includes(s.id);return `<div class="row"><div class="row-cover">${s.emoji}</div><div onclick="playSongById(${s.id})" style="cursor:pointer"><div class="row-title">${esc(s.title)}</div><div class="row-sub">${esc(s.artist)} • ${esc(s.album)}</div></div><span class="muted">TuneStream</span><div><button class="icon-btn ${il?"liked":""}" onclick="toggleLike(${s.id})">${il?"♥":"♡"}</button><button class="icon-btn" onclick="playSongById(${s.id})">▶</button></div></div>`}
function homePage(){currentPage="home";setActive("nav-home");document.getElementById("searchInput").value="";document.getElementById("content").innerHTML=`<section class="hero"><div class="muted">TUNESTREAM • YOUR MUSIC, YOUR WAY</div><h1>Feel the music.<br><span style="color:var(--green)">Live the moment.</span></h1><p>Discover new sounds, play your favorite tracks, build playlists and enjoy your personal music space — all from one beautiful web app.</p><div><button class="primary" onclick="playSongById(1)">▶ Start Listening</button><button class="secondary" onclick="searchPage()">🔎 Explore Music</button></div></section><div class="section-head"><h2>Made For You</h2><span class="muted">Fresh picks</span></div><div class="cards">${songs.slice(0,4).map(createCard).join("")}</div><div class="section-head"><h2>Trending Now</h2><span class="muted">Popular on TuneStream</span></div><div class="rows">${songs.slice(0,6).map(createRow).join("")}</div><div class="section-head"><h2>Why TuneStream?</h2></div><div class="cards"><div class="card"><div class="cover">🎧</div><h3>Discover</h3><p>Find music for every mood and moment.</p></div><div class="card"><div class="cover">❤️</div><h3>Your Favorites</h3><p>Save songs you never want to lose.</p></div><div class="card"><div class="cover">📁</div><h3>Playlists</h3><p>Create your own collections in seconds.</p></div><div class="card"><div class="cover">⚡</div><h3>Online Player</h3><p>Stream supported tracks directly in your browser.</p></div></div>`}
function searchPage(){currentPage="search";setActive("nav-search");document.getElementById("content").innerHTML='<div class="section-head"><h2>Search</h2></div><div id="searchResults" class="rows"><div class="empty">Type a song, artist or album in the search box.</div></div>';document.getElementById("searchInput").focus()}
function liveSearch(q){if(currentPage!=="search")searchPage();let v=q.trim().toLowerCase(),b=document.getElementById("searchResults");if(!v){b.innerHTML='<div class="empty">Type a song, artist or album in the search box.</div>';return}let f=songs.filter(s=>[s.title,s.artist,s.album].some(x=>x.toLowerCase().includes(v)));b.innerHTML=f.length?f.map(createRow).join(""):`<div class="empty">No results found for “${esc(q)}”.</div>`}
function libraryPage(){currentPage="library";setActive("nav-library");let l=songs.filter(s=>liked().includes(s.id)),p=JSON.parse(localStorage.getItem("tunestream_playlists")||"{}");document.getElementById("content").innerHTML=`<div class="section-head"><h2>Your Library</h2><button class="primary" onclick="createPlaylist()">＋ Create Playlist</button></div><p class="muted">Create playlists, add songs, and keep your favorite music organized.</p><div class="section-head"><h2>Your Playlists</h2></div><div class="cards">${Object.entries(p).map(([id,x])=>`<div class="card"><div class="cover">${playlistCover(x)}</div><h3>${esc(x.name)}</h3><p>${x.songs.length} songs</p><button class="secondary" style="margin:0" onclick="openPlaylist('${id}')">Open Playlist</button></div>`).join("")||'<div class="empty">No playlists yet. Create one above.</div>'}</div><div class="section-head"><h2>Liked music</h2></div><div class="rows">${l.length?l.map(createRow).join(""):'<div class="empty">No liked songs yet.</div>'}</div>`}
function likedPage(){currentPage="liked";setActive("nav-liked");document.getElementById("content").innerHTML=`<div class="section-head"><h2>Liked Songs</h2></div><div class="rows">${songs.filter(s=>liked().includes(s.id)).map(createRow).join("")||'<div class="empty">You have not liked any songs yet.</div>'}</div>`}
function playlistCover(x){let first=x.songs?.map(n=>songs.find(s=>s.id===n)).find(Boolean);return first?.audio?`<img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=700&q=85" alt="Playlist cover">`:`<img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=700&q=85" alt="Playlist cover">`} function playlistsPage(){currentPage="playlists";setActive("nav-playlists");let p=JSON.parse(localStorage.getItem("tunestream_playlists")||"{}");document.getElementById("content").innerHTML=`<div class="section-head"><h2>Your Playlists</h2><button class="primary" onclick="createPlaylist()">＋ New Playlist</button></div><div class="cards">${Object.entries(p).map(([id,x])=>`<div class="card"><div class="cover">${playlistCover(x)}</div><h3>${esc(x.name)}</h3><p>${x.songs.length} songs</p><button class="secondary" style="margin:0" onclick="openPlaylist('${id}')">Open</button></div>`).join("")||'<div class="empty">Create your first playlist.</div>'}</div>`}
function createPlaylist(){let n=prompt("Playlist name:");if(!n?.trim())return;let p=JSON.parse(localStorage.getItem("tunestream_playlists")||"{}"),id=Date.now().toString();p[id]={name:n.trim(),songs:[]};localStorage.setItem("tunestream_playlists",JSON.stringify(p));playlistsPage();toast("Playlist created")}
function openPlaylist(id){let p=JSON.parse(localStorage.getItem("tunestream_playlists")||"{}")[id];if(!p)return;currentPage="playlist";document.getElementById("content").innerHTML=`<div class="section-head"><h2>${esc(p.name)}</h2><div><button class="secondary" onclick="addToPlaylist('${id}')">＋ Add Song</button><button class="icon-btn" onclick="deletePlaylist('${id}')">🗑</button></div></div><div class="rows">${p.songs.map(n=>songs.find(s=>s.id===n)).filter(Boolean).map(createRow).join("")||'<div class="empty">This playlist is empty.</div>'}</div>`}
function addToPlaylist(id){let p=JSON.parse(localStorage.getItem("tunestream_playlists")||"{}");if(!p[id])return;let list=songs.map(s=>s.id+". "+s.title+" — "+s.artist).join("
");let n=Number(prompt("Choose a song to add:

"+list+"

Enter song number:"));if(!songs.some(s=>s.id===n))return toast("Invalid song number");if(p[id].songs.includes(n))return toast("Song already in playlist");p[id].songs.push(n);localStorage.setItem("tunestream_playlists",JSON.stringify(p));openPlaylist(id);toast("Song added to playlist 🎵")}
function deletePlaylist(id){if(!confirm("Delete this playlist?"))return;let p=JSON.parse(localStorage.getItem("tunestream_playlists")||"{}");delete p[id];localStorage.setItem("tunestream_playlists",JSON.stringify(p));playlistsPage()}
function historyPage(){currentPage="history";setActive("nav-history");let h=history().map(id=>songs.find(s=>s.id===id)).filter(Boolean);document.getElementById("content").innerHTML=`<div class="section-head"><h2>Recently Played</h2></div><div class="rows">${h.length?h.map(createRow).join(""):'<div class="empty">No listening history yet.</div>'}</div>`}
function playSongById(id){let i=queue.findIndex(s=>s.id===id);if(i>=0){currentIndex=i;startCurrentSong()}}
function addHistory(id){let h=history().filter(x=>x!==id);h.unshift(id);saveHistory(h.slice(0,30))}
function startCurrentSong(){let s=queue[currentIndex];if(!s)return;document.getElementById("nowTitle").textContent=s.title;document.getElementById("nowArtist").textContent=s.artist;progress.value=0;currentTime.textContent="0:00";duration.textContent="0:00";addHistory(s.id);if(!s.audio){playing=false;document.getElementById("playBtn").textContent="▶";toast("No online audio source.");return}audio.pause();audio.src=s.audio;audio.load();audio.play().then(()=>{playing=true;document.getElementById("playBtn").textContent="❚❚"}).catch(()=>{playing=false;document.getElementById("playBtn").textContent="▶";toast("Could not play this audio.")})}
function togglePlay(){let s=queue[currentIndex];if(!s)return;if(!s.audio)return toast("This track has no online audio source.");if(audio.paused){audio.play();playing=true;document.getElementById("playBtn").textContent="❚❚"}else{audio.pause();playing=false;document.getElementById("playBtn").textContent="▶"}}
function previousSong(){currentIndex=(currentIndex-1+queue.length)%queue.length;startCurrentSong()}function nextSong(){currentIndex=shuffle?Math.floor(Math.random()*queue.length):(currentIndex+1)%queue.length;startCurrentSong()}function toggleShuffle(){shuffle=!shuffle;document.getElementById("shuffleBtn").style.color=shuffle?"var(--green)":"var(--muted)";toast(shuffle?"Shuffle on":"Shuffle off")}function seek(v){if(audio.duration)audio.currentTime=Number(v)/100*audio.duration}
function toggleLike(id){let l=liked();l=l.includes(id)?l.filter(x=>x!==id):[...l,id];saveLiked(l);toast(l.includes(id)?"Added to Liked Songs":"Removed from Liked Songs");refreshCurrentPage()}function refreshCurrentPage(){({home:homePage,search:()=>liveSearch(document.getElementById("searchInput").value),library:libraryPage,liked:likedPage,playlists:playlistsPage,history:historyPage,playlist:()=>{}}[currentPage]||homePage)()}
function openAuth(){document.getElementById("authModal").style.display="grid";showLogin()}function closeAuth(){document.getElementById("authModal").style.display="none"}function showLogin(){authMode="login";document.getElementById("authTitle").textContent="Login";document.getElementById("authName").style.display="none";document.getElementById("authSwitch").innerHTML='New here? <button class="icon-btn" onclick="showSignup()">Create account</button>'}function showSignup(){authMode="signup";document.getElementById("authTitle").textContent="Create account";document.getElementById("authName").style.display="block";document.getElementById("authSwitch").innerHTML='Already have an account? <button class="icon-btn" onclick="showLogin()">Login</button>'}function submitAuth(){let n=document.getElementById("authName").value.trim(),e=document.getElementById("authEmail").value.trim();if(!e)return toast("Enter your email");localStorage.setItem("tunestream_user",JSON.stringify({name:n||e.split("@")[0],email:e}));updateProfile();closeAuth();toast(authMode==="signup"?"Account created":"Logged in")}
function updateProfile(){let u=JSON.parse(localStorage.getItem("tunestream_user")||"null");document.getElementById("profileName").textContent=u?.name||"Guest";let a=document.getElementById("avatar");a.textContent=(u?.name||"G").charAt(0).toUpperCase();if(u?.photo){a.style.backgroundImage=`url("${u.photo}")`;a.style.backgroundSize="cover";a.style.backgroundPosition="center";a.style.color="transparent"}else{a.style.backgroundImage="none";a.style.backgroundColor="var(--green)";a.style.color="#000"}document.getElementById("nav-login").style.display=u?"none":"block";document.getElementById("nav-download").style.display=u?"block":"none"} function changeProfilePhoto(e){let f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith("image/"))return toast("Please choose an image");if(f.size>2*1024*1024)return toast("Photo must be under 2 MB");let reader=new FileReader();reader.onload=()=>{let u=JSON.parse(localStorage.getItem("tunestream_user")||"null");if(!u)return toast("Please login first");u.photo=reader.result;localStorage.setItem("tunestream_user",JSON.stringify(u));updateProfile();toast("Profile photo updated")};reader.readAsDataURL(f)} function downloadTuneStream(){let html="<!DOCTYPE html>
"+document.documentElement.outerHTML;let blob=new Blob([html],{type:"text/html"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="TuneStream.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("TuneStream downloaded")}
audio.addEventListener("timeupdate",()=>{if(audio.duration){progress.value=audio.currentTime/audio.duration*100;currentTime.textContent=formatTime(audio.currentTime);duration.textContent=formatTime(audio.duration)}});audio.addEventListener("play",()=>{playing=true;document.getElementById("playBtn").textContent="❚❚"});audio.addEventListener("pause",()=>{playing=false;document.getElementById("playBtn").textContent="▶"});audio.addEventListener("ended",nextSong);function formatTime(s){s=Math.floor(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}updateProfile();homePage();
</script><script>
if("serviceWorker" in navigator){
  let tsRefreshing=false;
  async function checkTuneStreamUpdate(){
    try{
      const reg=await navigator.serviceWorker.getRegistration("./");
      if(reg) await reg.update();
    }catch(e){}
  }
  window.addEventListener("load",async()=>{
    try{
      const reg=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
      await reg.update();
      reg.addEventListener("updatefound",()=>{
        const worker=reg.installing;
        if(!worker)return;
        worker.addEventListener("statechange",()=>{
          if(worker.state==="installed" && navigator.serviceWorker.controller){
            worker.postMessage({action:"skipWaiting"});
          }
        });
      });
      setInterval(checkTuneStreamUpdate,60000);
    }catch(e){}
  });
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(tsRefreshing)return;
    tsRefreshing=true;
    window.location.reload();
  });
}
let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;showInstallButton()});
window.addEventListener("load",()=>setTimeout(showInstallButton,1200));
window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;hideInstallButton();toast("TuneStream installed successfully 🎧")});
function showInstallButton(){let b=document.getElementById("installAppBtn");if(b&&!window.matchMedia("(display-mode: standalone)").matches)b.classList.add("show")}
function hideInstallButton(){let b=document.getElementById("installAppBtn");if(b)b.classList.remove("show")}
async function installTuneStream(){
  if(!deferredInstallPrompt){
    if(/Android/i.test(navigator.userAgent))toast("Chrome menu ⋮ → Add to Home screen → Install TuneStream");
    else toast("Use your browser's Install App or Add to Home Screen option");
    return;
  }
  deferredInstallPrompt.prompt();
  const choice=await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  if(choice.outcome==="accepted"){hideInstallButton();toast("Installing TuneStream…")}
}
if(window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true)hideInstallButton();
</script>
